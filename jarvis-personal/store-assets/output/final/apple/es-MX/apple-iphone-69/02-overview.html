<!doctype html>
<!--
  Two store screenshots that read as one picture (editable). Rendered by scripts/compose.mjs once
  per half at the exact target size: the page is a canvas two images wide and 1 (0 or 1)
  says which half this image shows. The first screen's capture is a large tilted phone across the
  seam; the second screen's capture stands in the right half. The only UI drawn is the real
  captures. Google: frameless cards (no device frame). Apple: a generic frame (no real device model).
  Placeholders: as screen.html, plus 1 Sabé qué hacer con tu dinero hoy Cuánto podés gastar y qué pagar primero Plan VIP ../../../../../../../jarvis-personal/store-assets/raw/ios/es/phone/01-home.png
                Sabé cuánto tenés disponible este mes Ingresos, gastos y deudas en un solo lugar  ../../../../../../../jarvis-personal/store-assets/raw/ios/es/phone/02-overview.png  id=&quot;caption&quot;
                 id=&quot;shot&quot;.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --w: 1320px;
    --h: 2868px;
    --u: calc(var(--w) / 100);
    --night: #070E1A;
    --text: #EDF2F9;
    --text-2: #B3C0D2;
    --badge-bg: #F6EACD;
    --badge-text: #845600;
    --indigo-1: #2A2E6E;
    --indigo-2: #4A4FD9;
    --indigo-3: #8F95FF;
    --bezel: #05090f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text); background: var(--night); }
  /* The shared canvas, two images wide, moved so this image shows its half. */
  .canvas {
    position: absolute; top: 0; left: calc(var(--w) * -1); width: calc(var(--w) * 2); height: var(--h);
    background:
      radial-gradient(60% 55% at 46% 72%, var(--indigo-2), transparent 70%),
      radial-gradient(40% 45% at 92% 18%, var(--indigo-1), transparent 72%),
      linear-gradient(160deg, var(--night) 0%, var(--indigo-1) 55%, var(--night) 100%);
    overflow: hidden;
  }
  .caption { position: absolute; top: calc(var(--u) * 8); }
  .caption-a { left: calc(var(--u) * 8); width: calc(var(--u) * 84); text-align: left; }
  .caption-b { left: calc(var(--u) * 112); width: calc(var(--u) * 80); text-align: right; }
  .brand { display: inline-flex; align-items: center; gap: calc(var(--u) * 1.6); margin-bottom: calc(var(--u) * 2.6); }
  .brand img { width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: calc(var(--u) * 1.4); }
  .brand span { font-weight: 800; letter-spacing: 0.06em; font-size: calc(var(--u) * 3.4); color: var(--text-2); }
  h1 { font-size: calc(var(--u) * 8.4); line-height: 1.04; font-weight: 800; letter-spacing: -0.025em; }
  .caption-b h1 { font-size: calc(var(--u) * 6.6); }
  p.sub { margin-top: calc(var(--u) * 2); font-size: calc(var(--u) * 3.6); line-height: 1.3; color: var(--text-2); }
  .badge { display: inline-block; margin-top: calc(var(--u) * 2.2); padding: calc(var(--u) * 0.8) calc(var(--u) * 2.4); border-radius: 999px;
           background: var(--badge-bg); color: var(--badge-text); font-weight: 700; font-size: calc(var(--u) * 2.9); }
  .badge:empty { display: none; }
  .google h1 { font-size: calc(var(--u) * 7); }
  .google .caption-b h1 { font-size: calc(var(--u) * 5.6); }
  .google p.sub { font-size: calc(var(--u) * 3.2); margin-top: calc(var(--u) * 1.2); }

  /* A phone: the capture in a generic frame (Apple) or as a frameless card (Google). */
  .phone { position: absolute; display: flex; }
  .phone img { display: block; width: 100%; height: auto; }
  .apple .phone { padding: calc(var(--u) * 1.8); background: var(--bezel); border-radius: calc(var(--u) * 10);
                  box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0,0,0,.55); }
  .apple .phone img { border-radius: calc(var(--u) * 8.2); }
  .google .phone img { border-radius: calc(var(--u) * 5); box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0,0,0,.55); }
  /* The hero crosses the seam, tilted; the second phone stands upright on the right. */
  .phone-a { width: calc(var(--u) * 62); left: calc(var(--u) * 58); top: calc(var(--u) * 62); transform: rotate(-14deg); transform-origin: 50% 0; }
  .phone-b { width: calc(var(--u) * 46); left: calc(var(--u) * 142); top: calc(var(--u) * 78); }
  .watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
  }
  .watermark span {
    transform: rotate(-24deg); padding: calc(var(--u) * 2) calc(var(--u) * 6);
    background: rgba(180, 35, 63, .88); color: #fff; font-weight: 800;
    font-size: calc(var(--u) * 5); letter-spacing: 0.04em; white-space: nowrap;
  }
  .watermark:empty { display: none; }
</style>
</head>
<body class="apple">
  <div class="canvas">
    <header class="caption caption-a" >
      <div class="brand"><img src="../../../../../../../jarvis-personal/frontend/resources/icon.png" alt=""><span>DINCR</span></div>
      <h1>Sabé qué hacer con tu dinero hoy</h1>
      <p class="sub">Cuánto podés gastar y qué pagar primero</p>
      <span class="badge">Plan VIP</span>
    </header>
    <header class="caption caption-b" id=&quot;caption&quot;>
      <h1>Sabé cuánto tenés disponible este mes</h1>
      <p class="sub">Ingresos, gastos y deudas en un solo lugar</p>
      <span class="badge"></span>
    </header>
    <div class="phone phone-a"><img  src="../../../../../../../jarvis-personal/store-assets/raw/ios/es/phone/01-home.png" alt=""></div>
    <div class="phone phone-b"><img id=&quot;shot&quot; src="../../../../../../../jarvis-personal/store-assets/raw/ios/es/phone/02-overview.png" alt=""></div>
  </div>
  <div class="watermark"></div>
<script>
  addEventListener("load", () => {
    // Conservative text band: from the top of the first to the bottom of the last VISIBLE caption
    // element (brand row, title, subtitle, plan badge), as a share of the image HEIGHT (full width
    // assumed), so it over-estimates Google's "tagline area" rule rather than under-estimating it.
    const parts = [...document.querySelectorAll("#caption > *")]
      .map((el) => el.getBoundingClientRect()).filter((r) => r.width > 0 && r.height > 0);
    const shot = document.getElementById("shot");
    const band = parts.length ? Math.max(...parts.map((r) => r.bottom)) - Math.min(...parts.map((r) => r.top)) : 0;
    document.body.dataset.captionRatio = (band / innerHeight).toFixed(4);
    document.body.dataset.shotLoaded = shot ? String(shot.complete && shot.naturalWidth > 0) : "true";
  });
</script></body>
</html>
