<!doctype html>
<!--
  Google Play feature graphic (1024 x 500), editable. Brand only: icon, name, tagline, subtitle.
  No app UI, no calls to action, no store badges, no rankings.
  Placeholders: 1024 500 es Tu dinero, con propósito Finanzas personales claras para Costa Rica ../../../../../../../jarvis-personal/frontend/resources/icon.png DINCR  + {{c_*}}.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root { --w: 1024px; --h: 500px; --u: calc(var(--w) / 100); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 85% 20%, #0B6E68 0%, #0A1220 62%);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #EEF3F9;
    display: flex; align-items: center; gap: calc(var(--u) * 5); padding: 0 calc(var(--u) * 8);
    position: relative;
  }
  img { width: calc(var(--u) * 26); height: calc(var(--u) * 26); border-radius: calc(var(--u) * 5.5); box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 5) rgba(0,0,0,.5); }
  .name { font-weight: 800; letter-spacing: 0.08em; font-size: calc(var(--u) * 3.4); color: #3CCFBF; }
  h1 { margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 6.2); line-height: 1.08; font-weight: 800; }
  p { margin-top: calc(var(--u) * 1.6); font-size: calc(var(--u) * 2.8); color: #B3C0D2; }
  .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .watermark span { transform: rotate(-12deg); padding: calc(var(--u) * 1) calc(var(--u) * 4); background: rgba(180,35,63,.88); color: #fff; font-weight: 800; font-size: calc(var(--u) * 3.6); }
  .watermark:empty { display: none; }
</style>
</head>
<body>
  <img src="../../../../../../../jarvis-personal/frontend/resources/icon.png" alt="">
  <div>
    <div class="name">DINCR</div>
    <h1>Tu dinero, con propósito</h1>
    <p>Finanzas personales claras para Costa Rica</p>
  </div>
  <div class="watermark"></div>
<script>
  addEventListener("load", () => {
    // Conservative text band: from the top of the first to the bottom of the last VISIBLE caption
    // element (brand row, title, subtitle, plan badge), as a share of the image HEIGHT (full width
    // assumed), so it over-estimates Google's "tagline area" rule rather than under-estimating it.
    const parts = [...document.querySelectorAll("#caption > *")]
      .map((el) => el.getBoundingClientRect()).filter((r) => r.width > 0 && r.height > 0);
    const shot = document.getElementById("shot");
    const band = parts.length ? Math.max(...parts.map((r) => r.bottom)) - Math.min(...parts.map((r) => r.top)) : 0;
    document.body.dataset.captionRatio = (band / innerHeight).toFixed(4);
    document.body.dataset.shotLoaded = shot ? String(shot.complete && shot.naturalWidth > 0) : "true";
  });
</script></body>
</html>
