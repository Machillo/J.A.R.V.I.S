name: Native apps

on:
  pull_request:
    paths:
      - "DESIGN.md"
      - "jarvis-personal/native/**"
      - ".github/workflows/native-ci.yml"
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "jarvis-personal/native/**"

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node jarvis-personal/native/design-tokens/generate.mjs --check

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-personal/native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:data:test :app:assembleDebug :app:lintDebug --console=plain

  ios-kit:
    runs-on: macos-15
    defaults:
      run:
        working-directory: jarvis-personal/native/ios/DincrKit
    steps:
      - uses: actions/checkout@v4
      - run: swift test
