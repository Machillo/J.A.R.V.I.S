name: Native apps

# DESIGN.md is the token source for both apps, so a change there runs the drift check and both
# platform builds. The workflow file itself is included so CI changes are exercised too.
on:
  pull_request:
    paths:
      - "DESIGN.md"
      - "jarvis-personal/native/**"
      - ".github/workflows/native-ci.yml"
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "jarvis-personal/native/**"
      - ".github/workflows/native-ci.yml"

# CI of the parallel native prototype only: no secrets, no signing, no deploy, no distribution.
permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node jarvis-personal/native/design-tokens/generate.mjs --check
      - run: node --test jarvis-personal/native/design-tokens/generate.test.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jarvis-personal/native/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Release is built unsigned (no signing config, no secrets) to prove it compiles and
      # passes lint with R8; it is never uploaded. (It does not prove runtime behaviour.)
      - run: ./gradlew :core:data:test :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease --console=plain

  # Compose flows on an emulator: the minimum (API 24, java.time through desugaring) and a
  # current release. Fixture data only; no backend, no account.
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level == 24 && 'default' || 'google_apis' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: jarvis-personal/native/android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

  ios-kit:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jarvis-personal/native/ios/DincrKit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test

  # The app target (Swift 6 language mode: concurrency errors fail the build) and the XCUITest
  # flows on fixture data in a simulator.
  ios-app:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jarvis-personal/native/ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Runner images ship several Xcodes, and only some have a matching iOS simulator runtime.
      # Use the newest stable Xcode that lists a concrete iPhone simulator for this scheme.
      - name: Pick an Xcode and an iPhone simulator it supports
        id: sim
        run: |
          for xcode in $(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -Vr); do
            sudo xcode-select -s "$xcode"
            id=$(xcodebuild -project DINCR.xcodeproj -scheme DINCR -showdestinations 2>/dev/null \
              | grep "platform:iOS Simulator" | grep -v placeholder | grep "name:iPhone" | head -1 | sed -E 's/.*id:([^,]+),.*/\1/')
            if [ -n "$id" ]; then echo "Using $xcode, simulator $id"; break; fi
          done
          test -n "$id"
          xcodebuild -version
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - run: xcodebuild -project DINCR.xcodeproj -scheme DINCR -destination "id=${{ steps.sim.outputs.id }}" CODE_SIGNING_ALLOWED=NO test
