name: Native apps

# DESIGN.md is the token source for both apps, so a change there runs the drift check and both
# platform builds. store-assets/ captures the native apps (its tests read their capture tests).
# The workflow file itself is included so CI changes are exercised too.
on:
  pull_request:
    paths:
      - "DESIGN.md"
      - "jarvis-personal/native/**"
      - "jarvis-personal/store-assets/**"
      - ".github/workflows/native-ci.yml"
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "jarvis-personal/native/**"
      - "jarvis-personal/store-assets/**"
      - ".github/workflows/native-ci.yml"

# CI of the native apps: no secrets, no signing, no deploy, no distribution.
permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node jarvis-personal/native/design-tokens/generate.mjs --check
      - run: node --test jarvis-personal/native/design-tokens/generate.test.mjs
      # Store screenshots pipeline: gates, provenance and the capture tests' screen list (no browser).
      - run: node --test jarvis-personal/store-assets/scripts/store-assets.test.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jarvis-personal/native/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Both flavors (dincr = com.dincr.app, nativedev = side-by-side dev id). Release is built
      # unsigned (no signing config, no secrets) to prove it compiles and passes lint with R8; it
      # is never uploaded. Without Supabase config the app starts in its "not configured" state.
      - run: ./gradlew :core:data:test :app:assembleDebug :app:assembleRelease :app:lintNativedevDebug :app:lintDincrRelease --console=plain

  # Compose flows on an emulator: the minimum (API 24, java.time through desugaring) and a
  # current release. In-process FakeBackend (debug only); no backend, no account.
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level == 24 && 'default' || 'google_apis' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: jarvis-personal/native/android
          script: ./gradlew :app:connectedNativedevDebugAndroidTest --console=plain

  ios-kit:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jarvis-personal/native/ios/DincrKit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test

  # The app target (Swift 6 language mode: concurrency errors fail the build) and the XCUITest
  # flows on fixture data in a simulator.
  ios-app:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jarvis-personal/native/ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Runner images ship several Xcodes, and only some have a matching iOS simulator runtime.
      # Use the newest stable Xcode that lists a concrete iPhone simulator for this scheme.
      - name: Pick an Xcode and an iPhone simulator it supports
        id: sim
        # Switching Xcode restarts CoreSimulator, and right after it -showdestinations can list only
        # placeholders (intermittent "no destination" on the same image). So: wait for the service,
        # retry, and if this Xcode's runtime has no iPhone device, create one from what is installed.
        run: |
          pick() {
            xcodebuild -project DINCR.xcodeproj -scheme DINCR -showdestinations 2>&1 \
              | grep "platform:iOS Simulator" | grep -v placeholder | grep "name:iPhone" | head -1 | sed -E 's/.*id:([^,]+),.*/\1/'
          }
          for xcode in $(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -Vr); do
            sudo xcode-select -s "$xcode"
            xcrun simctl list runtimes >/dev/null 2>&1 || true
            id=""
            for attempt in 1 2 3; do
              id=$(pick)
              if [ -n "$id" ]; then break; fi
              echo "$xcode: no iPhone simulator destination yet (attempt $attempt)"
              sleep 15
            done
            if [ -z "$id" ]; then
              # The newest installed iOS runtime and an iPhone type it supports.
              pair=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS"]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          for r in reversed(rs):
              phones = [t for t in r.get("supportedDeviceTypes", []) if t.get("productFamily") == "iPhone"]
              if phones:
                  print(r["identifier"], phones[-1]["identifier"])
                  break
          ' || true)
              if [ -n "$pair" ]; then
                echo "$xcode: creating an iPhone simulator ($pair)"
                xcrun simctl create "DINCR CI iPhone" ${pair#* } ${pair% *} >/dev/null || true
                id=$(pick)
              fi
            fi
            if [ -n "$id" ]; then echo "Using $xcode, simulator $id"; break; fi
            echo "$xcode: no usable iPhone simulator"; xcrun simctl list runtimes || true
          done
          test -n "$id"
          xcodebuild -version
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - run: xcodebuild -project DINCR.xcodeproj -scheme DINCR -destination "id=${{ steps.sim.outputs.id }}" CODE_SIGNING_ALLOWED=NO test
        env:
          # OwnerExperienceUITests.testOwnerScreenshots writes the Owner screens here (synthetic fixtures)
          # for design review without a Mac; the test skips when this is unset.
          TEST_RUNNER_DINCR_OWNER_SHOTS_DIR: ${{ runner.temp }}/owner-shots
      - name: Upload the Owner screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-ios-screenshots
          path: ${{ runner.temp }}/owner-shots
          if-no-files-found: ignore
          retention-days: 14
