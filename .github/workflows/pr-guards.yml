name: PR guards

# Structural checks that apply to every PR regardless of the files it touches:
# base must be main, no hidden stacking, no merge into a non-main branch, no
# raised file-size budget, and a visible human gate for new migrations.
# Rules and override labels: .github/scripts/pr_guards.py and CLAUDE.md §9.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-guards:
    name: PR guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/pr_guards.py
        env:
          GH_TOKEN: ${{ github.token }}
