name: JARVIS pre-deploy checks

on:
  push:
    branches: [main]
    paths:
      - "jarvis-personal/**"
      - ".github/workflows/jarvis-ci.yml"
  pull_request:
    paths:
      - "jarvis-personal/**"

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-personal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-personal/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-personal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jarvis-personal/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: python -c "import backend.main"
