name: JARVIS pre-deploy checks

on:
  push:
    branches: [main]
    paths:
      - "jarvis-personal/**"
      - ".github/workflows/jarvis-ci.yml"
  pull_request:
    paths:
      - "jarvis-personal/**"

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-personal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-personal/frontend/package-lock.json
      - run: npm ci
      - run: npm run build:landing
      - run: npm run test:landing
      - run: npm run build
      - run: npm run test:navigation
      - run: npm run test:native-navigation
      - run: npm run test:product-analytics
      - run: npm run test:store-readiness
      - run: npm run test:legal-links
      - run: npm run test:ios-identity
      - run: npm run test:android-identity
      - run: npm run test:mail-oauth
      - run: npm run test:phase0j
      - run: npm run test:phase0h
      - run: npm run test:unified-movements
      - run: npm run test:phase0a
      - run: npm run test:phase0b
      - run: npm run test:phase0d
      - run: npm run test:phase0e
      - run: npm run test:phase0f
      - run: npm run test:phase0i
      - run: npm run test:locale
      - run: npm run test:i18n
      - run: npm run test:visual-freeze
      - run: npm run test:a11y
      - run: npm run test:plans

  frontend-lint-report:
    name: Frontend lint report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-personal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-personal/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend:
    name: Backend import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-personal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jarvis-personal/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m compileall -q backend
      - run: python -c "import backend.main"
      - run: python -m pytest -q backend
      - run: python backend/scripts/check_file_size_budget.py
      - run: python backend/scripts/check_public_secrets.py
