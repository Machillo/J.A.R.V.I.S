name: Exchange rate daily sync

# Once a day the backend reads the dollar's selling rate from the Banco Central and converts the
# dollar expenses whose close has arrived: POST /integrations/exchange-rates/cron
# (backend/integrations/bccr_rates.py). The run is late enough for the day's rate to be published.
#
# Needs (a scheduled run without them fails, so a missing setting is never a green no-op):
#   - repository variable DINCR_BACKEND_URL
#   - repository secret   DINCR_IBKR_CRON_SECRET (the same one as the IBKR sync), or DINCR_CRON_SECRET
#   - backend environment BCCR_API_TOKEN
# The secret travels only in the X-Jarvis-Cron-Secret header and is never printed. Only a status, a
# date and counts are logged: no amounts, no rates of a person, no account.
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 07:00 America/Costa_Rica, every day (a card can cut any day)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exchange-rate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.DINCR_BACKEND_URL }}
      CRON_SECRET: ${{ secrets.DINCR_IBKR_CRON_SECRET || secrets.DINCR_CRON_SECRET }}
    steps:
      - name: POST /integrations/exchange-rates/cron
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Exchange rate sync not configured (set the DINCR_BACKEND_URL variable and the DINCR_IBKR_CRON_SECRET secret)."
            exit 1
          fi
          code=000
          # Retry only transient failures (network error, a cold start or gateway timeout).
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST "${BASE_URL%/}/integrations/exchange-rates/cron" \
                   -H "X-Jarvis-Cron-Secret: ${CRON_SECRET}" --connect-timeout 30 --max-time 300 || echo 000)
            case "$code" in
              000|504) echo "attempt ${attempt}: HTTP ${code} (transient)"; sleep 30 ;;
              *) break ;;
            esac
          done
          case "$code" in
            200)
              python3 - <<'PY'
          import json
          data = json.load(open("body.json"))
          keys = ("status", "latest_rate_date", "rates", "closed_periods", "converted", "waiting_for_rate", "failed_workspaces")
          print({key: data.get(key) for key in keys})
          if data.get("failed_workspaces"):
              raise SystemExit("::error::some workspaces could not be closed; see the backend logs (error class only).")
          PY
              ;;
            403|503) echo "::error::HTTP ${code}: the cron secret does not match the backend's (or neither is set there)."; exit 1 ;;
            502) echo "::error::HTTP 502: the Banco Central gave no usable rates (token missing or expired, or the service is down)."; exit 1 ;;
            *) echo "::error::HTTP ${code}"; exit 1 ;;
          esac
          rm -f body.json
