name: IBKR daily sync

# The Owner's Interactive Brokers account is read once a day, read-only, through IBKR's Flex Web
# Service: POST /integrations/ibkr/flex/cron fetches the Flex statement (positions, cash,
# dividends) and stores one investment snapshot (integrations/ibkr_readonly.py). Nothing called
# that endpoint, so the portfolio stopped updating after its first sync (2026-09-04). This
# workflow is its scheduler. Flex statements cover the previous trading day.
#
# Needs (a scheduled run without them fails, so a missing setting is never a green no-op):
#   - repository variable DINCR_BACKEND_URL (already used by Financial history)
#   - repository secret   DINCR_IBKR_CRON_SECRET: the backend's IBKR_FLEX_CRON_SECRET (or, when
#     that one is not set, its EMAIL_MONITOR_CRON_SECRET). If it is not set, DINCR_CRON_SECRET is tried.
# The secret travels only in the X-Jarvis-Cron-Secret header and is never printed. The answer holds
# a status, a date and a count of positions; only those are logged (no account id, no amounts).
on:
  schedule:
    - cron: "0 12 * * 2-6"   # 12:00 UTC = 06:00 America/Costa_Rica, Tuesday to Saturday (after each trading day)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibkr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.DINCR_BACKEND_URL }}
      CRON_SECRET: ${{ secrets.DINCR_IBKR_CRON_SECRET || secrets.DINCR_CRON_SECRET }}
    steps:
      - name: POST /integrations/ibkr/flex/cron
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            # A scheduled run that cannot reach the backend reads nothing: fail instead of a green no-op.
            echo "::error::IBKR sync not configured (set the DINCR_BACKEND_URL variable and the DINCR_IBKR_CRON_SECRET secret)."
            exit 1
          fi
          code=000
          # Retry only transient failures (network error, a cold start or gateway timeout).
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST "${BASE_URL%/}/integrations/ibkr/flex/cron" \
                   -H "X-Jarvis-Cron-Secret: ${CRON_SECRET}" --connect-timeout 30 --max-time 300 || echo 000)
            case "$code" in
              000|504) echo "attempt ${attempt}: HTTP ${code} (transient)"; sleep 30 ;;
              *) break ;;
            esac
          done
          case "$code" in
            200)
              python3 - <<'PY'
          import json
          data = json.load(open("body.json"))
          print({"status": data.get("status"), "captured_at": str(data.get("captured_at") or "")[:10], "positions": data.get("positions")})
          PY
              ;;
            403|503) echo "::error::HTTP ${code}: the cron secret does not match the backend's IBKR_FLEX_CRON_SECRET / EMAIL_MONITOR_CRON_SECRET (or neither is set there)."; exit 1 ;;
            502) echo "::error::HTTP 502: IBKR Flex could not produce the statement (token expired, query missing or IBKR down); see the backend logs (error class only)."; exit 1 ;;
            *) echo "::error::HTTP ${code}"; exit 1 ;;
          esac
          rm -f body.json
